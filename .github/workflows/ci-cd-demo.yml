name: CI/CD Demo Pipeline - BP Tapera Scraper

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
    
    - name: Verify Python syntax
      run: |
        python -m py_compile src/scraper.py
    
    - name: Run scraper (dry run - download metadata only)
      run: |
        # Jalankan scraper; ini akan mengunduh file CSV
        # Untuk CI, sebaiknya batasi atau gunakan sample
        python src/scraper.py
    
    - name: Verify downloaded file exists
      run: |
        ls -la data/raw/
        # Cek bahwa ada setidaknya satu file CSV
        if ls data/raw/*.csv 1> /dev/null 2>&1; then
          echo "CSV file found."
        else
          echo "No CSV file downloaded. Check scraper logs."
          exit 1
        fi